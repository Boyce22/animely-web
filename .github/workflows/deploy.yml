name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check-git-flow:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Git Flow — main is not ahead of develop
        run: |
          COMMITS=$(git log --oneline --left-right main...develop 2>/dev/null)
          if echo "$COMMITS" | grep -q '^<'; then
            echo "::error title=Git Flow Violation::main has commits not in develop. Merge main into develop first."
            exit 1
          fi
          echo "Git Flow OK — main is in sync with develop"

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [check-git-flow]
    if: always() && !failure()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: SPA fallback — copy index.html to 404.html
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify — deployment complete
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ github.ref_name }}';
            const sha = '${{ github.sha }}';
            const env = '${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}';
            const pageUrl = '${{ steps.deployment.outputs.page_url }}';

            let body;
            if (env === 'production') {
              body = `## 🚀 Production Deployment Complete

              **Branch:** \`${branch}\`
              **Commit:** \`${sha.substring(0, 7)}\`
              **Pages URL:** ${pageUrl}

              Deployment to production completed successfully.

              _Triggered by DevSecOps via workflow_dispatch_
              `;
            } else {
              body = `## 🚀 Staging Deployment Complete

              **Branch:** \`${branch}\`
              **Commit:** \`${sha.substring(0, 7)}\`
              **Pages URL:** ${pageUrl}

              ### PerfEngineer — post-merge review required

              A new staging deployment was triggered. Please review:

              - [ ] Verify bundle size at ${pageUrl}
              - [ ] Run Lighthouse audit on key pages
              - [ ] Check for performance regressions
              - [ ] If approved, create a \`release/*\` PR from \`develop\` → \`main\` for production deployment

              ### DevSecOps — staging live

              Staging is deployed and available. Production deploy requires your manual trigger via \`workflow_dispatch\` with environment=production.

              ---
              _Automated post-deploy notification — [TSUAA Pipeline](/TSUAA/issues/TSUAA-66)_
              `;
            }

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha
            });

            const mergedPr = prs.find(pr => pr.merged_at && pr.base.ref === branch);
            if (mergedPr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: mergedPr.number,
                body: body
              });
            }

  notify-deploy-failure:
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Comment failure on triggering PR with reassignment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.sha }}';
            const branch = '${{ github.ref_name }}';
            const env = '${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            const body = `## ❌ Deployment Failed — Rollback Required

            **Environment:** \`${env}\`
            **Branch:** \`${branch}\`
            **Commit:** \`${sha.substring(0, 7)}\`
            **Failed Run:** ${runUrl}

            ### Action Required

            1. **Rollback:** Re-deploy the last successful build via \`workflow_dispatch\` with the previous commit
            2. **Investigate:** Check the failed run logs for the error
            3. **Reassign:** The engineer who authored the failing commit should investigate and fix

            ### Rollback commands

            Frontend (GitHub Pages):
            \`\`\`bash
            gh workflow run deploy.yml --ref ${{ github.ref_name }}
            \`\`\`

            Backend (VPS):
            \`\`\`bash
            ssh \$VPS_USER@\$VPS_HOST
            docker compose -f /opt/app/docker-compose.prod.yml down api
            docker compose -f /opt/app/docker-compose.prod.yml pull api
            docker compose -f /opt/app/docker-compose.prod.yml up -d api
            \`\`\`
            `;

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha
            });

            const mergedPr = prs.find(pr => pr.merged_at && pr.base.ref === branch);
            if (mergedPr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: mergedPr.number,
                body: body
              });
            }
