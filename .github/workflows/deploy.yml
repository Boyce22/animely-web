name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy performance notification
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.deployment.outputs.page_url }}';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'post-deploy/perf-verification',
              description: 'PerfEngineer: verify Core Web Vitals post-deploy',
              target_url: deployUrl,
            });

            const mergeMsg = context.payload.head_commit.message;
            const prMatch = mergeMsg.match(/#(\d+)/);
            if (prMatch) {
              const prNumber = prMatch[1];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(prNumber),
                body: `## Post-Deploy Verification\n\nDeployed to: ${deployUrl}\n\nPerfEngineer: please verify Core Web Vitals (LCP < 2.5s, INP < 200ms, CLS < 0.1) on the live deployment.`,
              });
            }
